<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#222321" media="(prefers-color-scheme: dark)">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <meta name="robots" content="{{robots}}">
    <link rel="canonical" href="{{canonical}}">
    <link rel="icon" href="/collection/favicon.svg" type="image/svg+xml">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:url" content="{{canonical}}">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:image" content="https://yousanfen.com/collection/objects.jpg">
    <meta property="og:image:alt" content="三分的私人陈列：号码布、数据匣和一本笔记，均为概念物件。">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{title}}">
    <meta name="twitter:description" content="{{description}}">
    <meta name="twitter:image" content="https://yousanfen.com/collection/objects.jpg">
    <script>
        try {
            const theme = localStorage.getItem('sanfen-collection-theme');
            if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        } catch {}
    </script>
</head>
<body data-page="{{page}}">
    <a class="skip-link" href="#main">跳到内容</a>
    <div class="museum">
        <header class="museum-header">
            <a class="museum-brand" href="/" aria-label="三分，返回陈列">三分<span lang="en">SANFEN</span></a>
            <nav aria-label="主导航">
                <a href="/" {{homeCurrent}}>陈列</a>
                <a href="/about/" {{aboutCurrent}}>关于</a>
            </nav>
            <button type="button" class="museum-light" id="museum-light" aria-label="切换展厅灯光" aria-pressed="false" hidden>
                <span class="light-dot" aria-hidden="true"></span><span id="museum-light-label">关灯</span>
            </button>
        </header>
        <main id="main" tabindex="-1">{{content}}</main>
        <footer class="museum-footer">
            <a href="/about/#collection-note">三分的私人陈列</a>
            <span lang="en">SANFEN <span class="footer-separator">/</span> EST. 2026</span>
        </footer>
    </div>
</body>
</html>
